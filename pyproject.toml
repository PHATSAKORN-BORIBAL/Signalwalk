[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalwalk"
version = "0.1.0"
description = "Walk around with a laptop, measure Wi-Fi signal, and get a coverage map, dead zones and router placement advice."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.25"]

[project.scripts]
signalwalk = "signalwalk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
